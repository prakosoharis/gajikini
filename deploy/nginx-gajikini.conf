# GajiKini — reverse proxy per subdomain (di belakang Cloudflare, TLS di edge).
# Port upstream mengikuti .env.prod (default: API 4100, web 3120, ops 3121, hr 3122).
# Pasang: salin ke /etc/nginx/sites-available/gajikini.conf + symlink ke sites-enabled,
# atau ke /etc/nginx/conf.d/ — lalu `nginx -t` dan reload.

server {
    listen 80;
    server_name api-gajikini.deluwang.online;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

