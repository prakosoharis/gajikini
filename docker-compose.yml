services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ewa
      POSTGRES_PASSWORD: ewa
      POSTGRES_DB: ewa
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ewa -d ewa"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://ewa:ewa@db:5432/ewa
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PORT: "4000"
      JWT_SECRET: dev-gajikini-jwt-secret
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3020:3000"
    depends_on:
      - api

  hr:
    build:
      context: .
      dockerfile: apps/hr/Dockerfile
    environment:
      INTERNAL_API_URL: http://api:4000
      COOKIE_SECURE: "false"
    ports:
      - "3022:3000"
    depends_on:
      - api

  internal:
    build:
      context: .
      dockerfile: apps/internal/Dockerfile
    environment:
      INTERNAL_API_URL: http://api:4000
      COOKIE_SECURE: "false"
    ports:
      - "3021:3000"
    depends_on:
      - api

volumes:
  pgdata:
